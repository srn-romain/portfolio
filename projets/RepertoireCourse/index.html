<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses à pied</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="../../assets/img/favicon.png" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/heroicons@2.0.18/dist/24/outline/index.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1476231682824-37e0d921d6b2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .modal {
            transition: opacity 0.3s ease;
        }
        .blur-bg {
            backdrop-filter: blur(5px);
        }
        .modal-content {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="min-h-screen bg-green-50 bg-opacity-90">
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl md:text-4xl font-bold text-green-800">📊 Carnet de courses</h1>
            <p id="statsText" class="text-green-600">Chargement des statistiques...</p>
        </div>
        <div class="mt-4 md:mt-0">
            <button id="addRaceBtn" class="flex items-center bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-full transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Ajouter une course
            </button>
        </div>
    </header>

    <!-- Search and Filter -->
    <div class="mb-8">
        <div class="relative mb-4">
            <input type="text" id="searchInput" placeholder="Rechercher une course..." class="w-full px-4 py-2 rounded-full border border-green-300 focus:outline-none focus:ring-2 focus:ring-green-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-3 top-2.5 text-green-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
        </div>
        <div id="yearFilters" class="flex flex-wrap gap-2">
            <button class="year-filter px-3 py-1 rounded-full bg-green-100 text-green-800 hover:bg-green-200 transition" data-year="all">Toutes</button>
            <!-- Les filtres seront générés dynamiquement ici -->
        </div>
    </div>

    <!-- Races Grid -->
    <div id="racesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Races will be added here by JavaScript -->
    </div>
</div>

<!-- Modal d'ajout/édition -->
<div id="raceModal" class="fixed inset-0 flex items-center justify-center z-50 hidden modal">
    <div class="absolute inset-0 bg-black bg-opacity-50 blur-bg"></div>
    <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md mx-4 z-10">
        <div class="p-6 modal-content">
            <h3 id="modalTitle" class="text-2xl font-bold text-green-800 mb-4">Ajouter une course</h3>
            <form id="raceForm">
                <input type="hidden" id="raceId">
                <div class="mb-4">
                    <label for="raceName" class="block text-green-700 mb-2">Nom de la course</label>
                    <input type="text" id="raceName" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-4">
                    <label for="raceDate" class="block text-green-700 mb-2">Date</label>
                    <input type="date" id="raceDate" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-4">
                    <label for="raceDistance" class="block text-green-700 mb-2">Distance (km)</label>
                    <input type="number" id="raceDistance" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-4">
                    <label for="raceElevation" class="block text-green-700 mb-2">Dénivelé (m)</label>
                    <input type="number" id="raceElevation" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-4">
                    <label for="raceTime" class="block text-green-700 mb-2">Temps (hh:mm:ss)</label>
                    <input type="text" id="raceTime" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="02:30:45" required>
                </div>
                <div class="mb-4">
                    <label for="raceLocation" class="block text-green-700 mb-2">Lieu</label>
                    <input type="text" id="raceLocation" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" required>
                </div>
                <div class="mb-4">
                    <label for="raceNotes" class="block text-green-700 mb-2">Notes</label>
                    <textarea id="raceNotes" rows="3" class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
                </div>
                <div class="mb-4">
                    <label for="racePhoto" class="block text-green-700 mb-2">Photo (optionnelle)</label>
                    <div class="border-2 border-dashed border-green-300 rounded-lg p-4 text-center hover:border-green-500 transition">
                        <input type="file" id="racePhoto" accept="image/*" class="hidden">
                        <label for="racePhoto" class="cursor-pointer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-12 w-12 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            <p class="mt-1 text-sm text-green-600">Cliquez ou déposez une photo ici</p>
                        </label>
                        <div id="photoPreview" class="mt-3 hidden">
                            <img id="previewImage" class="mx-auto max-h-40 rounded-lg" src="">
                            <button type="button" id="removePhoto" class="mt-2 text-red-600 text-sm hover:text-red-800">Supprimer</button>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelBtn" class="px-4 py-2 text-gray-600 hover:text-gray-800 transition">Annuler</button>
                    <button type="submit" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal de détails -->

            <h3 id="detailsTitle" class="text-2xl font-bold text-green-800 mb-2"></h3>
            <p id="detailsDate" class="text-green-600 mb-4"></p>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="bg-green-50 p-3 rounded-lg">
                    <p class="text-sm text-green-600">Distance</p>
                    <p id="detailsDistance" class="font-semibold text-green-800"></p>

                <div class="bg-green-50 p-3 rounded-lg">
                    <p class="text-sm text-green-600">Dénivelé</p>
                    <p id="detailsElevation" class="font-semibold text-green-800"></p>
                </div>
                <div class="bg-green-50 p-3 rounded-lg">
                    <p class="text-sm text-green-600">Temps</p>
                    <p id="detailsTime" class="font-semibold text-green-800"></p>
                </div>
                <div class="bg-green-50 p-3 rounded-lg">
                    <p class="text-sm text-green-600">Lieu</p>
                    <p id="detailsLocation" class="font-semibold text-green-800"></p>
                </div>
            </div>

            <div class="mb-4">
                <p class="text-sm text-green-600 mb-1">Notes</p>

</div>

<!-- Modal Mot de passe -->
<div id="passwordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-semibold text-gray-800">Authentification requise</h3>
            <button id="closePasswordModal" class="text-gray-500 hover:text-gray-700">

        </div>

        </div>
        <p id="passwordError" class="text-red-500 text-sm mb-4 hidden">Mot de passe incorrect</p>
        <div class="flex justify-end space-x-3">
            <button id="cancelAuthModal"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                Annuler
            </button>
            <button id="confirmPassword"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition-colors">
                Confirmer
            </button>
        </div>
    </div>
</div>

<!-- Modal de confirmation de suppression -->
<div id="confirmDeleteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
        <div class="mb-4">
            <h3 class="text-xl font-semibold text-gray-800">Confirmation</h3>
        </div>
        <p class="text-gray-600 mb-6">Êtes-vous sûr de vouloir supprimer cette course ?</p>
        <div class="flex justify-end space-x-3">
            <button id="cancelDelete" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">
                Annuler
            </button>
            <button id="confirmDelete" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg transition-colors">
                Supprimer
            </button>
        </div>
    </div>
</div>

<script>
    // Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyAQl3f8x9uafRTFIDvf6WtZPbjZtPbzU9M",
        authDomain: "macollectiondecourses.firebaseapp.com",
        projectId: "macollectiondecourses",
        storageBucket: "macollectiondecourses.firebasestorage.app",
        messagingSenderId: "749698169073",
        appId: "1:749698169073:web:a3e784c97af0151eb49150"
    };

    // Initialiser Firebase
    firebase.initializeApp(firebaseConfig);

    // Référence à Firestore
    const db = firebase.firestore();
    const racesCollection = db.collection('races');

    // Charger les courses depuis Firebase
    let races = [];

    function loadRaces() {
        racesContainer.innerHTML = '<div class="col-span-3 text-center py-12"><svg class="animate-spin h-10 w-10 text-green-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><p class="mt-2 text-green-700">Chargement des courses...</p></div>';

        racesCollection.get().then((querySnapshot) => {
            races = [];
            querySnapshot.forEach((doc) => {
                races.push({
                    id: doc.id,
                    ...doc.data()
                });
            });

            // Calculer et afficher les statistiques
            updateStats(races);

            // Générer les filtres d'années basés sur les données
            generateYearFilters(races);

            // Afficher toutes les courses
            displayRaces(races);
        }).catch((error) => {
            console.error("Erreur lors du chargement des courses:", error);
            racesContainer.innerHTML = '<div class="col-span-3 text-center py-12"><p class="text-red-600">Erreur lors du chargement des courses. Veuillez rafraîchir la page.</p></div>';
        });
    }

    // Nouvelle fonction pour calculer et afficher les statistiques
    function updateStats(racesData) {
        // Initialiser les statistiques
        let totalDistance = 0;
        let totalElevation = 0;
        let totalSeconds = 0;
        const totalRaces = racesData.length;

        // Calculer les totaux
        racesData.forEach(race => {
            totalDistance += parseFloat(race.distance) || 0;
            totalElevation += parseInt(race.elevation) || 0;

            // Convertir le temps (format hh:mm:ss) en secondes
            if (race.time) {
                const timeParts = race.time.split(':');
                if (timeParts.length === 3) {
                    const hours = parseInt(timeParts[0]) || 0;
                    const minutes = parseInt(timeParts[1]) || 0;
                    const seconds = parseInt(timeParts[2]) || 0;
                    totalSeconds += hours * 3600 + minutes * 60 + seconds;
                }
            }
        });

        // Formater le temps total en heures et minutes
        const totalHours = Math.floor(totalSeconds / 3600);
        const remainingMinutes = Math.floor((totalSeconds % 3600) / 60);

        // Arrondir la distance à 1 décimale
        totalDistance = Math.round(totalDistance * 10) / 10;

        // Mettre à jour le texte des statistiques
        const statsElement = document.getElementById('statsText');
        statsElement.innerHTML = `
        <span class="font-semibold">${totalRaces}</span> courses |
        <span class="font-semibold">${totalDistance}</span> km parcourus |
        <span class="font-semibold">${totalElevation}</span> m de dénivelé |
        <span class="font-semibold">${totalHours}h${remainingMinutes}</span> de course
    `;
    }

    // Modifier la fonction filterRacesByYear pour mettre à jour les statistiques
    function filterRacesByYear(year) {
        if (year === 'all') {
            updateStats(races);
            displayRaces(races);
            return;
        }

        const filteredRaces = races.filter(race => {
            const raceDate = new Date(race.date);
            return raceDate.getFullYear().toString() === year;
        });

        updateStats(filteredRaces);
        displayRaces(filteredRaces);
    }

    // Modifier la fonction searchRaces pour mettre à jour les statistiques
    function searchRaces(query) {
        const filteredRaces = races.filter(race =>
            race.name.toLowerCase().includes(query.toLowerCase()) ||
            race.location.toLowerCase().includes(query.toLowerCase())
        );

        updateStats(filteredRaces);
        displayRaces(filteredRaces);
    }

    function generateYearFilters(races) {
        const yearFiltersContainer = document.getElementById('yearFilters');
        yearFiltersContainer.innerHTML = '';

        // Toujours ajouter le filtre "Toutes"
        const allFilter = document.createElement('button');
        allFilter.className = 'year-filter px-3 py-1 rounded-full bg-green-100 text-green-800 hover:bg-green-200 transition';
        allFilter.dataset.year = 'all';
        allFilter.textContent = 'Toutes';
        allFilter.classList.add('bg-green-600', 'text-white');
        yearFiltersContainer.appendChild(allFilter);

        // Extraire les années uniques des courses
        const years = [...new Set(races.map(race => {
            const date = new Date(race.date);
            return date.getFullYear();
        }))];

        // Trier les années par ordre décroissant (plus récentes d'abord)
        years.sort((a, b) => b - a);

        // Créer un bouton pour chaque année
        years.forEach(year => {
            const yearFilter = document.createElement('button');
            yearFilter.className = 'year-filter px-3 py-1 rounded-full bg-green-100 text-green-800 hover:bg-green-200 transition';
            yearFilter.dataset.year = year.toString();
            yearFilter.textContent = year.toString();
            yearFiltersContainer.appendChild(yearFilter);
        });

        // Ajouter les écouteurs d'événements pour les nouveaux filtres
        document.querySelectorAll('.year-filter').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.year-filter').forEach(btn =>
                    btn.classList.remove('bg-green-600', 'text-white'));
                button.classList.add('bg-green-600', 'text-white');
                filterRacesByYear(button.dataset.year);
            });
        });
    }

    // DOM Elements
    const racesContainer = document.getElementById('racesContainer');
    const searchInput = document.getElementById('searchInput');
    const addRaceBtn = document.getElementById('addRaceBtn');
    const raceModal = document.getElementById('raceModal');
    const detailsModal = document.getElementById('detailsModal');
    const raceForm = document.getElementById('raceForm');
    const modalTitle = document.getElementById('modalTitle');
    const cancelBtn = document.getElementById('cancelBtn');
    const closeDetailsBtn = document.getElementById('closeDetailsBtn');
    const passwordModal = document.getElementById('passwordModal');
    const closePasswordModal = document.getElementById('closePasswordModal');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordInput = document.getElementById('passwordInput');
    const passwordError = document.getElementById('passwordError');
    const passwordHash = '7cfae86dbdef5b6712ca464daaa4a65fb1c528cc45d4473360b8e9b344c0d67e';
    const confirmDeleteModal = document.getElementById('confirmDeleteModal');
    const cancelDelete = document.getElementById('cancelDelete');
    const confirmDelete = document.getElementById('confirmDelete');
    let raceIdToDelete = null;

    // Gérer l'événement de clic sur le bouton d'ajout
    addRaceBtn.addEventListener('click', () => {
        showPasswordModal('add');
    });

    // Fonction pour afficher le modal de confirmation de suppression
    function showConfirmDeleteModal(raceId) {
        raceIdToDelete = raceId;
        confirmDeleteModal.classList.remove('hidden');
    }

    // Gestionnaire pour annuler la suppression
    cancelDelete.addEventListener('click', () => {
        confirmDeleteModal.classList.add('hidden');
        raceIdToDelete = null;
    });

    // Gestionnaire pour confirmer la suppression
    confirmDelete.addEventListener('click', () => {
        if (raceIdToDelete) {
            // Afficher un indicateur de chargement
            confirmDelete.disabled = true;
            confirmDelete.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

            racesCollection.doc(raceIdToDelete).delete()
                .then(() => {
                    loadRaces();
                    confirmDeleteModal.classList.add('hidden');
                })
                .catch((error) => {
                    console.error("Erreur lors de la suppression:", error);
                    alert('Erreur lors de la suppression de la course.');
                })
                .finally(() => {
                    confirmDelete.disabled = false;
                    confirmDelete.textContent = 'Supprimer';
                    raceIdToDelete = null;
                });
        }
    });

    // Fonction de hashage SHA-256
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        return hashHex;
    }

    // Fermer le modal de mot de passe
    closePasswordModal.addEventListener('click', () => {
        passwordModal.classList.add('hidden');
        passwordInput.value = '';
        passwordError.classList.add('hidden');
    });

    // Confirmer le mot de passe
    confirmPassword.addEventListener('click', async function () {
        const inputHash = await sha256(passwordInput.value);

        if (inputHash === passwordHash) {
            passwordModal.classList.add('hidden');
            passwordInput.value = '';
            passwordError.classList.add('hidden');

            // Récupérer le contexte et l'ID de la course si applicable
            const context = passwordModal.dataset.context;
            const raceId = passwordModal.dataset.raceId;

            // Selon le contexte, ouvrir le bon modal
            if (context === 'add') {
                // Afficher le modal d'ajout de course
                modalTitle.textContent = 'Ajouter une course';
                raceForm.reset();
                document.getElementById('raceId').value = '';

                // Réinitialiser l'état de la photo
                photoData = null;
                photoPreview.classList.add('hidden');

                raceModal.classList.remove('hidden');
                document.getElementById('raceName').focus();
            }
            else if (context === 'edit') {
                // Préparer le formulaire pour l'édition
                modalTitle.textContent = 'Modifier la course';

                // Appeler la fonction de remplissage de formulaire
                populateEditForm(raceId);

                raceModal.classList.remove('hidden');
                document.getElementById('raceName').focus();
            }
            else if (context === 'delete' && raceId) {
                showConfirmDeleteModal(raceId);
            }
        } else {
            // Mot de passe incorrect
            passwordError.classList.remove('hidden');
            passwordInput.focus();
        }
    });

    // Permettre la validation du mot de passe avec la touche Entrée
    passwordInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') {
            confirmPassword.click();
        }
    });

    // Display races
    function displayRaces(racesToDisplay) {
        // Tri des courses par date (plus récentes en haut)
        const sortedRaces = [...racesToDisplay].sort((a, b) => {
            // Convertir les dates en objets Date pour la comparaison
            const dateA = new Date(a.date);
            const dateB = new Date(b.date);

            // Ordre décroissant (plus récent en premier)
            return dateB - dateA;
        });

        if (sortedRaces.length === 0) {
            racesContainer.innerHTML = '<div class="col-span-3 text-center py-12"><p class="text-gray-500">Aucune course trouvée</p></div>';
            return;
        }
        racesContainer.innerHTML = '';

        sortedRaces.forEach(race => {
            const raceDate = new Date(race.date);
            const year = raceDate.getFullYear();

            const raceCard = document.createElement('div');
            raceCard.className = 'bg-white rounded-xl overflow-hidden shadow-md card-hover relative group cursor-pointer';
            raceCard.innerHTML = `
            <div class="p-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-xl font-bold text-green-800 mb-1">${race.name}</h3>
                        <p class="text-green-600">${raceDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</p>
                    </div>
                    <span class="px-2 py-1 bg-green-100 text-green-800 text-xs rounded-full">${year}</span>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <div class="flex space-x-2">
                        <span class="px-2 py-1 bg-green-50 text-green-800 text-xs rounded-full">${race.distance} km</span>
                        <span class="px-2 py-1 bg-green-50 text-green-800 text-xs rounded-full">+${race.elevation} m</span>
                    </div>
                    <div class="flex space-x-2 items-center">
                        <button class="edit-race p-2 bg-green-100 text-green-800 rounded-md hover:bg-green-200 transition-colors" data-id="${race.id}" title="Modifier">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </button>
                        <button class="delete-race p-2 bg-red-100 text-red-800 rounded-md hover:bg-red-200 transition-colors" data-id="${race.id}" title="Supprimer">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <button class="details-btn p-2 bg-blue-100 text-blue-800 rounded-md hover:bg-blue-200 transition-colors" data-id="${race.id}" title="Détails">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        `;

            racesContainer.appendChild(raceCard);

            // Rendre toute la carte cliquable
            raceCard.addEventListener('click', (e) => {
                // Ne pas déclencher si on clique sur les boutons d'édition/suppression/détails
                if (!e.target.closest('.edit-race') && !e.target.closest('.delete-race') && !e.target.closest('.details-btn')) {
                    showRaceDetails(race.id);
                }
            });

            // Ajouter un écouteur d'événement pour le bouton détails
            const detailsBtn = raceCard.querySelector('.details-btn');
            detailsBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Évite de déclencher l'événement de la carte
                showRaceDetails(race.id);
            });

            // Ajouter des écouteurs d'événements pour éditer et supprimer
            const editBtn = raceCard.querySelector('.edit-race');
            const deleteBtn = raceCard.querySelector('.delete-race');

            editBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Empêche le déclenchement du clic sur la carte
                showPasswordModal('edit', race.id);
            });

            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Empêche le déclenchement du clic sur la carte
                showPasswordModal('delete', race.id);
            });
        });
    }

    // Modifier la fonction showRaceDetails pour afficher la photo
    function showRaceDetails(id) {
        const race = races.find(r => r.id === id);
        if (!race) return;

        const raceDate = new Date(race.date);

        document.getElementById('detailsTitle').textContent = race.name;
        document.getElementById('detailsDate').textContent = raceDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('detailsDistance').textContent = `${race.distance} km`;
        document.getElementById('detailsElevation').textContent = `${race.elevation} m D+`;
        document.getElementById('detailsTime').textContent = race.time;
        document.getElementById('detailsLocation').textContent = race.location;

        // Gérer l'affichage des notes
        const notesSection = document.querySelector('#detailsModal .mb-4:has(#detailsNotes)');
        if (race.notes && race.notes.trim() !== '') {
            notesSection.classList.remove('hidden');
            document.getElementById('detailsNotes').textContent = race.notes;
        } else {
            notesSection.classList.add('hidden');
        }

        // Gérer l'affichage de la photo
        const photoContainer = document.getElementById('detailsPhotoContainer');
        const photo = document.getElementById('detailsPhoto');

        if (race.photo) {
            photo.src = race.photo;
            photoContainer.classList.remove('hidden');
        } else {
            photoContainer.classList.add('hidden');
        }

        detailsModal.classList.remove('hidden');
    }

    // Fonction pour afficher le modal de mot de passe avec différents contextes
    function showPasswordModal(context, raceId = null) {
        passwordModal.dataset.context = context;
        if (raceId) {
            passwordModal.dataset.raceId = raceId;
        } else {
            passwordModal.dataset.raceId = '';
        }
        passwordModal.classList.remove('hidden');
        passwordInput.value = '';
        passwordError.classList.add('hidden');
        passwordInput.focus();
    }

    // Référence au bouton d'annulation d'authentification
    const cancelAuthModal = document.getElementById('cancelAuthModal');

    // Gestionnaire d'événements pour annuler l'authentification
    cancelAuthModal.addEventListener('click', function() {
        passwordModal.classList.add('hidden');
        passwordInput.value = '';
        passwordError.classList.add('hidden');
    });

    // Add new race
    function addRace() {
        modalTitle.textContent = 'Ajouter une course';
        raceForm.reset();
        document.getElementById('raceId').value = '';
        raceModal.classList.remove('hidden');
    }

    function populateEditForm(raceId) {
        const race = races.find(r => r.id === raceId);
        if (!race) return;

        document.getElementById('raceId').value = race.id;
        document.getElementById('raceName').value = race.name;
        document.getElementById('raceDate').value = race.date;
        document.getElementById('raceDistance').value = race.distance;
        document.getElementById('raceElevation').value = race.elevation;
        document.getElementById('raceTime').value = race.time;
        document.getElementById('raceLocation').value = race.location;
        document.getElementById('raceNotes').value = race.notes || '';

        // Réinitialiser d'abord la gestion de photos
        photoData = null;
        racePhoto.value = '';

        // Vérifier si la course a une photo et l'afficher
        if (race.photo) {
            photoData = race.photo; // Important : stocker l'image existante dans photoData
            previewImage.src = race.photo;
            photoPreview.classList.remove('hidden');
        } else {
            photoPreview.classList.add('hidden');
        }
    }

    // Sauvegarder une course
    function saveRace(e) {
        e.preventDefault();

        const id = document.getElementById('raceId').value;
        const name = document.getElementById('raceName').value;
        const date = document.getElementById('raceDate').value;
        const distance = parseFloat(document.getElementById('raceDistance').value);
        const elevation = parseInt(document.getElementById('raceElevation').value);
        const time = document.getElementById('raceTime').value;
        const location = document.getElementById('raceLocation').value;
        const notes = document.getElementById('raceNotes').value;

        if (!name || !date || isNaN(distance) || isNaN(elevation) || !time || !location) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
        }

        const raceData = {
            name,
            date,
            distance,
            elevation,
            time,
            location,
            notes
        };

        // Ajouter la photo seulement si elle existe
        if (photoData) {
            raceData.photo = photoData;
        }

        // Afficher un indicateur de chargement dans le bouton
        const submitBtn = raceForm.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

        // Mettre à jour ou ajouter la course
        let savePromise;

        // Dans la fonction saveRace
        if (id) {
            // Si on modifie une course existante
            const currentRace = races.find(r => r.id === id);

            // Si photoData est null et qu'il y avait une photo avant, on retire la photo
            if (photoData === null && currentRace && currentRace.photo) {
                // On supprime explicitement la photo
                raceData.photo = firebase.firestore.FieldValue.delete();
            } else if (photoData) {
                // Si une photo est fournie (nouvelle ou conservée), on l'utilise
                raceData.photo = photoData;
            }

            savePromise = racesCollection.doc(id).update(raceData);
        } else {
            // Si on ajoute une nouvelle course
            if (photoData) {
                raceData.photo = photoData;
            }
            savePromise = racesCollection.add(raceData);
        }

        savePromise
            .then(() => {
                // Actualiser la liste
                loadRaces();
                raceModal.classList.add('hidden');

                // Réinitialiser le formulaire
                raceForm.reset();
            })
            .catch((error) => {
                console.error("Erreur lors de la sauvegarde de la course:", error);
                alert('Une erreur est survenue lors de la sauvegarde de la course.');
            })
            .finally(() => {
                // Restaurer le bouton
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            });
    }

    const racePhoto = document.getElementById('racePhoto');
    const photoPreview = document.getElementById('photoPreview');
    const previewImage = document.getElementById('previewImage');
    const removePhoto = document.getElementById('removePhoto');
    let photoData = null;

    // Gestionnaire d'événement pour l'upload de photo
    racePhoto.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoData = e.target.result; // Stocker les données de l'image
                previewImage.src = e.target.result;
                photoPreview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    });

    // Gestionnaire pour supprimer la photo
    removePhoto.addEventListener('click', function() {
        photoData = null; // mettre à null pour indiquer la suppression
        racePhoto.value = '';
        previewImage.src = '';
        photoPreview.classList.add('hidden');
    });

    // Ajouter le support du glisser-déposer
    const dropArea = document.querySelector('.border-dashed');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, highlight, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, unhighlight, false);
    });

    function highlight() {
        dropArea.classList.add('border-green-500', 'bg-green-50');
    }

    function unhighlight() {
        dropArea.classList.remove('border-green-500', 'bg-green-50');
    }

    dropArea.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const file = dt.files[0];

        if (file && file.type.startsWith('image/')) {
            racePhoto.files = dt.files;

            const reader = new FileReader();
            reader.onload = function(e) {
                photoData = e.target.result;
                previewImage.src = e.target.result;
                photoPreview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    // Modifier la fonction filterRacesByYear
    function filterRacesByYear(year) {
        if (year === 'all') {
            displayRaces(races);
            return;
        }

        const filteredRaces = races.filter(race => {
            const raceDate = new Date(race.date);
            return raceDate.getFullYear().toString() === year;
        });

        displayRaces(filteredRaces);
    }

    // Modifier la fonction searchRaces
    function searchRaces(query) {
        const filteredRaces = races.filter(race =>
            race.name.toLowerCase().includes(query.toLowerCase()) ||
            race.location.toLowerCase().includes(query.toLowerCase())
        );

        displayRaces(filteredRaces);
    }

    // Écouteur pour le bouton Annuler
    cancelBtn.addEventListener('click', () => {
        // Fermer le modal
        raceModal.classList.add('hidden');
        // Réinitialiser le formulaire
        raceForm.reset();
    });

    // Event listeners
    closeDetailsBtn.addEventListener('click', () => detailsModal.classList.add('hidden'));
    raceForm.addEventListener('submit', saveRace);

    searchInput.addEventListener('input', (e) => {
        searchRaces(e.target.value);
    });

    // Initialiser
    loadRaces();
</script>
</body>
</html>
